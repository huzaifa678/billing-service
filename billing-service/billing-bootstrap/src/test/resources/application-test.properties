spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
springdoc.cache.disabled=false
bucket4j.enabled=false
spring.grpc.client.enabled=false
stripe.api.key=sk_test_dummy
spring.kafka.consumer.auto-offset-reset=earliest
# Boot 4.1.1 trips the Spring Cloud release-train verifier (it expects 4.0.x); disable
# it so the context loads, exactly as the verifier's error message instructs.
spring.cloud.compatibility-verifier.enabled=false
# No OTLP collector in tests, and the OTel SDK/incubator versions are skewed
# (NoClassDefFoundError ExtendedAttributeKey when building a log record), so keep
# all exporters off during tests.
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
management.logging.export.otlp.enabled=false