plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'org.asciidoctor.jvm.convert' version '4.0.5' apply false
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1' apply false
    id 'jacoco'
}

ext {
    set('springGrpcVersion', "1.0.2")
    set('springCloudVersion', "2025.1.0")
    set('confluentVersion', "7.6.1")
    // avro 1.11.3 -> 1.11.4 fixes CVE-2024-47561 (schema-parsing RCE).
    set('avroVersion', "1.11.4")
    set('springBootVersion', "4.1.0")
}

allprojects {
    group = 'com.project'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven {
            url = "https://packages.confluent.io/maven/"
        }
        maven {
            name = "buf"
            url = "https://buf.build/gen/maven"
            credentials(HttpHeaderCredentials)
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    // Security overrides for libraries pinned by the Spring Boot dependency BOM. The BOM
    // forces exact versions, so a plain constraint is ignored; the supported override is
    // to bump the BOM's own version property (names from spring-boot-dependencies.pom).
    // jackson 2.x 2.21.5 -> 2.21.7: CVE-2026-89407/89425/68497/91776/91777 (DoS).
    ext['jackson-2-bom.version'] = '2.21.7'
    // jackson 3.x (tools.jackson) 3.1.5 -> 3.1.7: same CVE family.
    ext['jackson-bom.version'] = '3.1.7'
    // tomcat 11.0.24 -> 11.0.25: CVE-2026-65182 (CRITICAL), CVE-2026-65905, CVE-2026-68525.
    ext['tomcat.version'] = '11.0.25'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        implementation(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
        implementation(platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"))
        implementation(platform("org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"))
        // The platform BOMs above only constrain the implementation config; the
        // annotation processor path needs the Boot BOM too, otherwise Lombok has no
        // managed version and compilation fails to resolve it.
        annotationProcessor(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        constraints {
            implementation("at.yawk.lz4:lz4-java:1.11.4")
            implementation("org.bouncycastle:bcprov-jdk18on:1.85")
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
