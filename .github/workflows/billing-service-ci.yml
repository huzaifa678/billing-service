name: billing-service CI

on:
  push:
    branches: [dev]
    paths: [billing-service/**]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read

    defaults:
      run:
        # Gradle root is the billing-service/ subdirectory (gradlew, settings.gradle,
        # build.gradle and all modules live there); the repo root has no wrapper.
        working-directory: billing-service

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Install buf CLI
        # compileJava depends on generateBufCode (billing-adapters), which runs
        # `buf generate` with remote plugins, so buf must be on PATH in CI.
        run: |
          BUF_VERSION=1.68.4
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" \
            -o "$HOME/.local/bin/buf"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install SonarScanner
        run: |
          # Use the JRE-less CLI (not the -linux build): the -linux zip bundles its own
          # Java 17 and forces it, which SonarCloud rejects. This variant runs on the
          # JAVA_HOME that setup-java provides (JDK 21).
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip
          unzip sonar-scanner.zip
          echo "$(pwd)/sonar-scanner-5.0.1.3006/bin" >> $GITHUB_PATH

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          ORG_GRADLE_PROJECT_bufAuthHeaderName: Authorization
          ORG_GRADLE_PROJECT_bufAuthHeaderValue: Bearer ${{ secrets.BUF_TOKEN }}

      - name: Run lint & Code quality check
        run: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: "billing-service"
          SONAR_ORGANIZATION: "huzaifa678"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names billing-service \
            --query 'repositories[0].repositoryUri' --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: billing-service
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}
          # Buf token for the in-Dockerfile bootJar build (buf.build/gen/maven dependency
          # + `buf generate` remote plugins). Consumed via --mount=type=secret,id=buf_token.
          secrets: |
            buf_token=${{ secrets.BUF_TOKEN }}

      - name: Trivy image scan (scan-before-push gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        run: docker push "${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}"
